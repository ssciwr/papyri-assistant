name: papyri-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scrapyrus
      POSTGRES_USER: scrapyrus
      POSTGRES_PASSWORD: scrapyrus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapyrus -d scrapyrus"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-setup:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPASSWORD: scrapyrus
      POSTGRES_DB: scrapyrus
      POSTGRES_USER: scrapyrus
      PAPYRI_QUERY_PASSWORD: ${PAPYRI_QUERY_PASSWORD:?PAPYRI_QUERY_PASSWORD must be set}
    entrypoint: ["/postgres-setup/10-query-reader.sh"]
    volumes:
      - ./docker/postgres-init:/postgres-setup:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    environment:
      BACKEND_PORT: "3001"
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      POSTGRES_URL: postgresql://papyri_query_reader:${PAPYRI_QUERY_PASSWORD:?PAPYRI_QUERY_PASSWORD must be set}@postgres:5432/scrapyrus
      HF_TOKEN: ${HF_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      EMBEDDING_ENDPOINT_VLLM: ${EMBEDDING_ENDPOINT_VLLM:-}
      AGENT_CONFIG: /app/backend/configs/default_langchain_agent.yaml
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: ${BACKEND_HEALTH_START_PERIOD:-15m}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        VITE_API_URL: ${PROD_VITE_API_URL:-/api}
        VITE_WARNING_BANNER_TEXT: ${VITE_WARNING_BANNER_TEXT:-}
    ports:
      - "${FRONTEND_HTTP_PORT:-${FRONTEND_PORT:-80}}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    environment:
      FRONTEND_HTTPS_PORT: ${FRONTEND_HTTPS_PORT:-443}
      NGINX_ENVSUBST_FILTER: "^FRONTEND_HTTPS_PORT$$"
    secrets:
      - source: tls_certificate
        target: /etc/nginx/tls/tls.pem
      - source: tls_private_key
        target: /etc/nginx/tls/tls.key
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

secrets:
  tls_certificate:
    file: ${TLS_CERTIFICATE_PATH:-./certs/tls.pem}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_PATH:-./certs/tls.key}

volumes:
  huggingface-cache:
