embeddings:
  type: langchain_voyageai.VoyageAIEmbeddings
  kwargs:
    voyage_api_key: ${VOYAGE_API_KEY}
    model: voyage-4-large
    output_dimension: &embedding_dim 1024
    batch_size: 64
splitter_kwargs:
  chunk_size: 1000
  chunk_overlap: 200

# voyage-4-large returns normalized 1024-dimensional vectors with this explicit
# output_dimension. The retriever config must use the same model and dimension.
store_kwargs:
  table_name: embeddings
  schema_name: public
  vector_size: *embedding_dim
  content_column: content
  embedding_column: embedding
  id_column:
    name: chunk_id
    data_type: TEXT
    nullable: false
  metadata_columns:
    - name: source
      data_type: TEXT
      nullable: false
    - name: transcription_id
      data_type: TEXT
      nullable: false
  metadata_json_column: metadata
