embeddings:
  type: langchain_voyageai.VoyageAIEmbeddings
  kwargs:
    voyage_api_key: ${VOYAGE_API_KEY}
    model: voyage-4-large
    output_dimension: &embedding_dim 1024
    batch_size: 64

# Must match voyage_ai_langchain_embeddings.yaml.
store_kwargs:
  table_name: embeddings
  schema_name: public
  vector_size: *embedding_dim
  content_column: content
  embedding_column: embedding
  id_column:
    name: chunk_id
    data_type: TEXT
    nullable: false
  metadata_columns:
    - name: source
      data_type: TEXT
      nullable: false
    - name: transcription_id
      data_type: TEXT
      nullable: false
  metadata_json_column: metadata

similarity_search_kwargs:
  k: 1
mmr_search_kwargs:
  k: 4
