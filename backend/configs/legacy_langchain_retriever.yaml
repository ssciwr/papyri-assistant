embeddings:
  type: langchain_voyageai.VoyageAIEmbeddings
  kwargs:
    voyage_api_key: ${VOYAGE_API_KEY}
    model: voyage-4-large
    output_dimension: &embedding_dim 1024
    batch_size: 64

# Read Scrapyrus transcription embeddings directly. Scrapyrus stores multiple
# models in this table, so every search must remain scoped to the matching model.
store_kwargs:
  table_name: transcription_embeddings
  schema_name: public
  vector_size: *embedding_dim
  content_column: document_text
  embedding_column: embedding
  id_column:
    name: xml_id
    data_type: BIGINT
    nullable: false
  metadata_columns:
    - name: model_name
      data_type: TEXT
      nullable: false
    - name: chunk_index
      data_type: INTEGER
      nullable: false
    - name: source_path
      data_type: TEXT
      nullable: false
    - name: tm_id
      data_type: TEXT
      nullable: false
    - name: language
      data_type: TEXT
      nullable: true
  metadata_json_column: null

similarity_search_kwargs:
  k: 1
  filter:
    model_name: voyage-4-large
mmr_search_kwargs:
  k: 4
  filter:
    model_name: voyage-4-large
