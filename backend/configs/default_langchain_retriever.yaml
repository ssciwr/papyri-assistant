embeddings:
  type: langchain_huggingface.HuggingFaceEmbeddings
  kwargs:
    model_name: Qwen/Qwen3-Embedding-8B
    model_kwargs:
      truncate_dim: 2000 # Must match ingestion vectors in default_langchain_embedder.yaml.
    encode_kwargs:
      normalize_embeddings: True

# Must match the table contract in default_langchain_embedder.yaml.
store_kwargs:
  table_name: embeddings
  schema_name: public
  vector_size: 2000
  content_column: content
  embedding_column: embedding
  id_column:
    name: chunk_id
    data_type: TEXT
    nullable: false
  metadata_columns:
    - name: source
      data_type: TEXT
      nullable: false
    - name: transcription_id
      data_type: TEXT
      nullable: false
  metadata_json_column: metadata

similarity_search_kwargs:
  k: 1
mmr_search_kwargs:
  k: 4
