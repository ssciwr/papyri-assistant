# Keyword arguments for deepagents.create_deep_agent, as consumed by
# LangChainAgent.from_config (papyri_backend.langchain_agent).
#
# Conventions used below:
#   - plain scalars/lists are passed through as they are
#   - a mapping with a "type" key names a Python object by dotted path; the
#     optional "kwargs" mapping is passed to it, i.e.
#         type: pkg.mod.Object
#         kwargs: {a: 1}
#     becomes  pkg.mod.Object(a=1)
#     (drop "kwargs" to pass the object itself rather than an instance)
#   - "${VAR}" is read from the environment, which settings.load_environment()
#     populates from backend/.env
#
# Anything commented out is a kwarg create_deep_agent accepts but this setup
# does not use yet; the comment records what it expects.

# The chat model. Both ollama and vllm serve an OpenAI-compatible API, so
# ChatOpenAI with base_url pointed at the local server covers both; the model
# name itself comes from .env and is not pinned here.
# (langchain_ollama.ChatOllama is the alternative if ollama-only features are
# needed; a "provider:model" string such as "ollama:qwen3" also works.)
model:
  type: langchain_openai.ChatOpenAI
  kwargs:
    temperature: 0.0
  # model, api key and base_url are set via env vars

# Caller-authored system instructions, placed before the deepagents base prompt.
system_prompt: &sysprompt "You are a concise, helpful assistant" # TODO

# Extra tools, by dotted path, merged with the built-ins (ls, read_file,
# write_file, edit_file, glob, grep, execute, task). Additive only.
# TODO: the database tools arrive here once the MCP client is wired up
# (langchain_mcp_adapters), which needs an async load rather than a dotted path.
tools: []

# Tools the run pauses on for human review. A value of true allows every
# decision; a mapping restricts them. Allowed decisions are
# approve | edit | reject | respond, and LangChainAgent renders them as the
# numbered menu in _process_action_request.
# interrupt on all call? How does steering actually work in langgraph
interrupt_on:
  write_file:
    allowed_decisions: ["approve", "edit", "reject"]
  edit_file:
    allowed_decisions: ["approve", "edit", "reject"]
  execute: # only ever fires with a sandbox backend; see "backend" below
    allowed_decisions: ["approve", "reject"]

# Filesystem access rules, evaluated in order (mode: allow | deny | interrupt).
# Off by default so the agent keeps the deepagents default of a free filesystem;
# enable to fence it into the project.
# permissions:
#   - {operations: ["read", "write"], paths: ["**"], mode: "allow"}
#   - {operations: ["write"], paths: ["/etc/**", "~/.ssh/**"], mode: "deny"}

# Named subagents the "task" tool can delegate to. Each entry needs name,
# description and system_prompt, and may add tools/model/interrupt_on.
# TODO: fill in once the papyrological subagents are defined.
# subagents: []

# checkpointer: LangChainAgent already installs a
#   langgraph.checkpoint.memory.InMemorySaver when none is given, because
#   interrupts cannot be resumed without one. Set it here to persist threads,
#   e.g. type: langgraph.checkpoint.sqlite.SqliteSaver
# store: BaseStore for cross-thread state, required by the "memory" kwarg below
# memory: list of AGENTS.md-style files loaded as persistent context
# skills: list of skill directories exposed to the agent
# middleware: extra langchain middleware, inserted after the deepagents stack
# backend: filesystem backend; defaults to an in-state one, so files live in
#   graph state and "execute" returns an error until a sandbox backend is set
# response_format: structured-output strategy for the final answer
# state_schema / context_schema: custom DeepAgentState / runtime context types
# name, debug, cache: graph name, verbose tracing, and a langgraph cache
