embeddings:
  type: langchain_voyageai.VoyageAIEmbeddings
  kwargs:
    voyage_api_key: ${VOYAGE_API_KEY}
    model: voyage-4-large
    model_kwargs:
    encode_kwargs:
      normalize_embeddings: True
      batch_size: 64
splitter_kwargs:
  chunk_size: 1000
  chunk_overlap: 200

# The schema for the PGVectorStore table. The retriever will use this same
# contract when it moves from the legacy PGVector collection store.
store_kwargs:
  table_name: embeddings
  schema_name: public
  content_column: content
  embedding_column: embedding
  id_column:
    name: chunk_id
    data_type: TEXT
    nullable: false
  metadata_columns:
    - name: source
      data_type: TEXT
      nullable: false
    - name: transcription_id
      data_type: TEXT
      nullable: false
  metadata_json_column: metadata
