[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papyri-backend"
version = "0.1.0"
description = "FastAPI and LangChain chat backend for the Papyri assistant."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.7",
    "fastapi>=0.116.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.0.0",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "psycopg>=3.3.4",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
tests = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
papyri-backend = "papyri_backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "-m",
    "not integration and not live_model",
    "--cov=papyri_backend",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]
markers = [
    "integration: requires real PostgreSQL/pgvector or other external services",
    "live_model: requires explicitly supplied model endpoint credentials",
]

[tool.coverage.run]
branch = true
source = ["papyri_backend"]

[tool.coverage.report]
show_missing = true
fail_under = 90
