name: papyri-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scrapyrus
      POSTGRES_USER: scrapyrus
      POSTGRES_PASSWORD: scrapyrus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapyrus -d scrapyrus"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"

  postgres-setup:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPASSWORD: scrapyrus
      POSTGRES_DB: scrapyrus
      POSTGRES_USER: scrapyrus
      PAPYRI_QUERY_PASSWORD: ${PAPYRI_QUERY_PASSWORD:-papyri-reader}
    entrypoint: ["/postgres-setup/10-query-reader.sh"]
    volumes:
      - ./docker/postgres-init:/postgres-setup:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    depends_on:
      postgres-setup:
        condition: service_completed_successfully
    environment:
      BACKEND_PORT: "3001"
      BACKEND_RELOAD: "1"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      POSTGRES_URL: postgresql://papyri_query_reader:${PAPYRI_QUERY_PASSWORD:-papyri-reader}@postgres:5432/scrapyrus
      HF_TOKEN: ${HF_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      EMBEDDING_ENDPOINT_VLLM: ${EMBEDDING_ENDPOINT_VLLM:-}
      AGENT_CONFIG:  /app/backend/configs/default_langchain_agent.yaml
      PYTHONPATH: /app/backend/src
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/skills:/app/skills:ro
      - huggingface-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: ${BACKEND_HEALTH_START_PERIOD:-15m}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_WARNING_BANNER_TEXT: ${VITE_WARNING_BANNER_TEXT:-}
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  huggingface-cache:
